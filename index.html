<!DOCTYPE html>
<html lang="en" class="antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UNCUTstash AI | Private Intelligence Engine</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- GSAP & ScrollTrigger -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    
    <!-- Lenis Smooth Scroll -->
    <script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.29/bundled/lenis.min.js"></script>
    
    <!-- Three.js for Procedural Background -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>

    <!-- View Transitions API Polyfill (for older browsers, though native in 2026) -->
    <meta name="view-transition" content="same-origin">

    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-slate-950 text-slate-50 overflow-hidden selection:bg-cyan-500/30">

    <!-- Animated Preloader -->
    <div id="preloader" class="fixed inset-0 z-[100] flex flex-col items-center justify-center bg-slate-950">
        <div class="relative w-32 h-32 mb-8">
            <svg class="w-full h-full animate-spin-slow" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="48" fill="none" stroke="rgba(6, 182, 212, 0.2)" stroke-width="2"></circle>
                <circle cx="50" cy="50" r="48" fill="none" stroke="#06b6d4" stroke-width="2" stroke-dasharray="300" stroke-dashoffset="250" class="animate-pulse-glow"></circle>
            </svg>
            <div class="absolute inset-0 flex items-center justify-center">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
                </svg>
            </div>
        </div>
        <h1 class="text-2xl font-light tracking-widest text-cyan-400 mb-2">SOVEREIGN AI</h1>
        <p id="boot-status" class="text-sm text-slate-400 font-mono h-6">Initializing WebGPU Subsystem...</p>
        <div class="w-64 h-1 bg-slate-800 rounded-full mt-4 overflow-hidden">
            <div id="boot-progress" class="h-full bg-cyan-400 w-0 transition-all duration-300 ease-out"></div>
        </div>
    </div>

    <!-- Procedural WebGL Background -->
    <canvas id="webgl-canvas" class="fixed inset-0 z-0 pointer-events-none opacity-60"></canvas>

    <!-- Main Application Layout -->
    <main class="relative z-10 flex flex-col h-[100dvh] max-w-5xl mx-auto p-4 md:p-8">
        
        <!-- Header -->
        <header class="flex items-center justify-between pb-6 border-b border-white/10 glass-panel rounded-2xl px-6 py-4 mb-6">
            <div class="flex items-center gap-4">
                <div class="w-10 h-10 rounded-full bg-cyan-500/20 flex items-center justify-center border border-cyan-500/30 shadow-[0_0_15px_rgba(6,182,212,0.3)]">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                        <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                        <line x1="12" y1="22.08" x2="12" y2="12"></line>
                    </svg>
                </div>
                <div>
                    <h2 class="text-lg font-semibold tracking-wide">Sovereign Engine</h2>
                    <p id="engine-badge" class="text-xs text-amber-400 font-mono flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span> Booting...
                    </p>
                </div>
            </div>
            <button class="magnetic-btn px-4 py-2 rounded-lg bg-white/5 hover:bg-white/10 border border-white/10 transition-colors text-sm font-medium">
                Settings
            </button>
        </header>

        <!-- Chat History Area -->
        <div id="chat-container" class="flex-1 overflow-y-auto pr-2 space-y-6 pb-32 scroll-smooth custom-scrollbar">
            <!-- Welcome Message -->
            <div class="chat-message ai-message opacity-0 translate-y-4 flex gap-4 max-w-[85%]">
                <div class="w-8 h-8 rounded-full bg-cyan-500/20 flex-shrink-0 flex items-center justify-center border border-cyan-500/30 mt-1">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#06b6d4" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                </div>
                <div class="glass-panel p-4 rounded-2xl rounded-tl-none text-slate-200 leading-relaxed shadow-lg">
                    System online. Dual-engine inference architecture initialized. Awaiting input...
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="absolute bottom-4 md:bottom-8 left-4 right-4 md:left-8 md:right-8 max-w-5xl mx-auto">
            <div class="glass-panel p-2 rounded-2xl border border-white/10 shadow-2xl flex items-end gap-2 focus-within:border-cyan-500/50 transition-colors duration-300">
                <textarea id="prompt-input" rows="1" class="w-full bg-transparent text-slate-100 placeholder-slate-500 px-4 py-3 outline-none resize-none max-h-32 min-h-[48px]" placeholder="Query the Sovereign Engine..."></textarea>
                <button id="send-btn" class="magnetic-btn w-12 h-12 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 flex items-center justify-center flex-shrink-0 transition-transform disabled:opacity-50 disabled:cursor-not-allowed">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="translate-x-[-2px] translate-y-[2px]">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>div id="root"></div>

  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
